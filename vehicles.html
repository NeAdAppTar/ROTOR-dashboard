<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Список ПС</title>

  <link rel="stylesheet" href="style_db.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="icon.png">

  <script src="usermenu.js"></script>

  <!-- Иконки -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .state-new { background-color: #b0dfb0 !important; }   /* Зеленый */
    .state-ne { background-color: #e5d866 !important; }    /* Желтый */
    .state-norm { background-color: transparent !important; }
  </style>
</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">
  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>Список ПС</h1>

    <button id="manageEmployeesBtn"
            style="display:none; padding: 8px 14px; font-size: 14px; cursor: pointer;">
        Изменить список ПС
    </button>
</div>

    <p>Автобусы, борт.номера которых начинающиеся с 10хх принадлежат организации, 11хх — личный ПС сотрудников.</p>

    <div id="loading" class="loading">Получение информации от сервера...</div>

    <div id="tableContainer" style="display:none;">
      <table class="styled-table" id="vehiclesTable">
        <thead>
          <tr>
            <th>Бортовой номер</th>
            <th>Гос. номер</th>
            <th>Модель</th>
            <th>Построен</th>
            <th>С (эксплуатации)</th>
            <th>Примечание</th>
          </tr>
        </thead>
        <tbody id="vehiclesBody"></tbody>
      </table>
      <p id="summary" class="summary"></p>
    </div>
  </main>
</div>

<script>
const pageAccess = null;

const ALLOWED_POSTS = [
  "Директор",
  "Зам. директора",
  "Технический администратор"
];

const COMPANY = "rotor";
const API_BASE = "https://api.rotorbus.ru";

// ---------- utils ----------
function getCookie(name) {
  const match = document.cookie.match(
    new RegExp("(^| )" + name + "=([^;]+)")
  );
  return match ? decodeURIComponent(match[2]) : null;
}

// ---------- access for button ----------
async function checkAccessForButton() {
  const username = getCookie("userLogin");
  if (!username) return;

  try {
    const res = await fetch(`${API_BASE}/users/${COMPANY}`);
    if (!res.ok) return;

    const data = await res.json();
    if (data.status !== "ok") return;

    const user = data.users.find(u => u.name === username);
    if (!user) return;

    if (ALLOWED_POSTS.includes(user.post)) {
      document.getElementById("manageEmployeesBtn").style.display = "inline-block";
    }
  } catch (e) {
    console.error("Ошибка проверки доступа:", e);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("manageEmployeesBtn").onclick =
    () => window.location.href = "vehicles-a.html";

  checkAccessForButton();
});

// ---------- load vehicles ----------
async function loadVehicles() {
  const loading = document.getElementById("loading");
  const tbody = document.getElementById("vehiclesBody");
  const tableContainer = document.getElementById("tableContainer");
  const summary = document.getElementById("summary");

  try {
    const res = await fetch(`${API_BASE}/vehicles/${COMPANY}`);
    if (!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();
    if (data.status !== "ok") throw new Error("Ошибка API");

    tbody.innerHTML = "";

    const vehicles = [...data.vehicles].sort((a, b) => {
      const aNum = parseInt(a.board_number, 10);
      const bNum = parseInt(b.board_number, 10);
      if (isNaN(aNum)) return 1;
      if (isNaN(bNum)) return -1;
      return aNum - bNum;
    });

    vehicles.forEach(v => {
      const tr = document.createElement("tr");

      if (v.state === "new") tr.classList.add("state-new");
      else if (v.state === "ne") tr.classList.add("state-ne");
      else tr.classList.add("state-norm");

      tr.innerHTML = `
        <td>${v.board_number || "-"}</td>
        <td>${v.state_number || "-"}</td>
        <td>${v.model || "-"}</td>
        <td>${v.built || "-"}</td>
        <td>${v.since || "-"}</td>
        <td>${v.note || ""}</td>
      `;

      tbody.appendChild(tr);
    });

    loading.style.display = "none";
    tableContainer.style.display = "block";
    summary.innerHTML = `Общее количество ПС: <b>${vehicles.length}</b>`;

  } catch (err) {
    console.error(err);
    loading.textContent = "Ошибка загрузки: " + err.message;
  }
}

loadVehicles();
</script>


<script src="sidebar.js"></script>
<script src="checkauth.js"></script>
</body>
</html>
