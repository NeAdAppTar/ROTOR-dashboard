<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Статистика зарплаты</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style_db.css">
  <link rel="stylesheet" href="style_a.css">

  <style>
    .salary-table td, .salary-table th {
      padding: 10px;
      text-align: left;
    }

    .money {
      font-weight: 600;
      color: #047857;
    }

    .period {
      color: #1d4ed8;
    }

    .user {
      font-weight: 500;
    }

    tr:hover {
      background: #f8fafc;
    }
  </style>
</head>
<body>

<div id="sidebar-container"></div>

<div class="main-content">
<div class="container">

<h1>Зарплата сотрудников</h1>

<div class="table-card">
<table class="styled-table salary-table">
<thead>
<tr>
  <th>Сотрудник</th>
  <th>Должность</th>
  <th>Зарплата всего</th>
  <th>Зарплата за период</th>
  <th>Рейсы</th>
  <th>Пассажиры</th>
</tr>
</thead>
<tbody id="statsBody"></tbody>
</table>
</div>

</div>
</div>

<script>
const pageAccess = ["Директор", "Технический администратор"];
const API = 'https://api.rotorbus.ru';
const COMPANY = 'rotor';

async function loadStats() {
  const res = await fetch(`${API}/statistics/${COMPANY}`);
  const data = await res.json();

  if (data.status !== "ok") {
    alert("Ошибка загрузки статистики");
    return;
  }

  statsBody.innerHTML = "";

  data.statistics.forEach(s => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="user">${s.user_name}</td>
      <td>${s.post}</td>
      <td class="money">${s.total_salary} ₽</td>
      <td class="money period">${s.period_salary} ₽</td>
      <td>${s.total_round_trips} / ${s.period_round_trips}</td>
      <td>${s.total_passengers} / ${s.period_passengers}</td>
    `;

    statsBody.appendChild(tr);
  });
}

loadStats();
</script>

</body>
<script src="sidebar.js"></script>
<script src="checkauth.js"></script>
</html>
